
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f4f4;
            text-align:center;
        }

        .box{
            width:350px;
            margin:auto;
            margin-top:80px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        button{
            width:250px;
            padding:12px;
            margin:10px;
            font-size:16px;
            cursor:pointer;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
        }

        button:hover{
            background:#0056b3;
        }
    </style>

</head>

<body>

<div class="box">

<h1>Admin Dashboard</h1>

<p>Welcome Admin!</p>

<button onclick="window.location='users.html'">
Manage Users
</button>

<button onclick="logout()">
Logout
</button>

</div>

<script>

function logout(){

    alert("Logged out successfully!");

    window.location="index.html";

}

</script>

</body>
</html>
